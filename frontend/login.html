<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Aerarium</title>
  <link rel="stylesheet" href="css/landing.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <main class="auth-wrapper">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-heading">
        <a href="/" class="brand-badge" aria-label="Aerarium home"><span class="gold-gem" aria-hidden="true"></span>Aerarium</a>
        <h1 id="auth-title">Welcome back</h1>
        <p>Sign in to view your company’s software spend.</p>
      </div>

      <div class="demo-callout">
        <div class="demo-title-row">
          <strong>Explore the sample workspace</strong>
          <span class="sample-badge">Demo</span>
        </div>
        <p>Use sample subscriptions and treasury figures to explore the console. No vendor accounts are connected; actions update the demo ledger only.</p>
        <button id="btn-quick-demo" class="btn-gold" type="button">Enter sample workspace <i data-lucide="arrow-right" aria-hidden="true"></i></button>
      </div>

      <div class="auth-divider">OR SIGN IN WITH EMAIL</div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" class="form-input" value="cfo@aerarium.io" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" value="aerarium123" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-subtle form-submit">Sign in</button>
      </form>

      <a href="/" class="back-link">← Back to Aerarium</a>
    </section>
  </main>

  <script>
    if (window.lucide) lucide.createIcons();

    // Enter the seeded sample workspace.
    document.getElementById('btn-quick-demo').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/auth/demo', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('aerarium_token', data.token);
          localStorage.setItem('aerarium_user', JSON.stringify(data.user));
          window.location.href = '/app';
        }
      } catch (err) {
        alert('Login failed: ' + err.message);
      }
    });

    // Standard email sign-in.
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('aerarium_token', data.token);
          localStorage.setItem('aerarium_user', JSON.stringify(data.user));
          window.location.href = '/app';
        } else {
          alert(data.message || 'Invalid credentials');
        }
      } catch (err) {
        alert('Authentication failed');
      }
    });
  </script>
</body>
</html>
